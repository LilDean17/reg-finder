# 全局排除规则：命中则扣分

- type: domain_keyword
  weight: -40
  indicators:
    - mail
    - staging
    - dev.
    - example
    - localhost

- type: body_keyword
  weight: -50
  indicators:
    - domain for sale
    - this domain expired
    - parking
    - 注册已关闭
    - 暂停注册
    - 注册通道关闭
    - 暂不开放注册

- type: status_code
  weight: -40
  indicators:
    - 403
    - 404
    - 500
