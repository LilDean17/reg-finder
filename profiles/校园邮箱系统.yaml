# 校园邮箱/Webmail 检测：识别高校邮件系统
# 这类站点通常无开放注册，命中后扣分
- name: 校园邮箱检测
  weight: -20
  threshold: 2
  category: 校园邮箱
  checks:
    - type: body_keyword
      weight: -10
      indicators:
        - 校园邮箱
        - 学校邮箱
        - 学生邮箱
        - Webmail
        - 邮件系统
        - 邮箱登录
        - 邮件服务
        - 邮件客户端
        - 学生邮件
        - 教职工邮箱
        - 邮件系统登录
        - 邮箱用户
        - 邮箱系统
        - 登录
        - 登陆
        - 登 陆
        - 登 录
        - 登  录
        - 登  陆
        - mail.

    - type: title_keyword
      weight: -5
      indicators:
        - 邮箱
        - Webmail
        - 邮件系统
        - 校园邮箱

    - type: path
      weight: -1
      indicators:
        - /mail/
        - /webmail/
        - /email/
        - /roundcube/
        - /coremail/
        - /163mail/
        - /mail/login
